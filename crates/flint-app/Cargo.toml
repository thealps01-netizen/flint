[package]
name = "flint-app"
version = "0.1.1"
edition = "2024"
description = "Flint launcher: find a file by part of its name and open it"
license = "MIT"

[[bin]]
name = "flint"
path = "src/main.rs"

[features]
# the bundled UI (tauri dev builds without default features and loads the dev server)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flint-core = { version = "0.1.1", path = "../flint-core" }
flint-indexer = { version = "0.1.1", path = "../flint-indexer" }
png = "0.18.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_Common", "Win32_System_Threading"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }
