[package]
name = "flint-indexer"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flint-core = { version = "0.1.1", path = "../flint-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Environment", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console"] }
